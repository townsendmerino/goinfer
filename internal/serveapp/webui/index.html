<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>goinfer</title>
<link rel="stylesheet" href="ui/app.css">

<header class="ambient amb-surface amb-elevation-1">
  <h1 class="brand">goinfer</h1>
  <div class="stats" id="stats"></div>
  <a class="book-link" href="https://townsendmerino.github.io/goinfer/" target="_blank" rel="noopener">Book</a>
  <nav>
    <button class="ambient amb-surface amb-rounded" id="tab-chat" aria-selected="true">Chat</button>
    <button class="ambient amb-surface amb-rounded" id="tab-models" aria-selected="false">Models</button>
  </nav>
</header>

<main>
<section id="pane-chat">
  <div class="card ambient amb-surface amb-chamfer amb-elevation-1 amb-rounded">
    <div class="row">
      <div><label for="model">Model</label><select id="model"></select></div>
      <div class="fit" style="flex:0 0 110px"><label for="temp">Temperature</label>
        <input id="temp" type="number" value="0.7" min="0" max="2" step="0.1"></div>
      <div class="fit" style="flex:0 0 110px"><label for="max">Max tokens</label>
        <input id="max" type="number" value="512" min="1" step="1"></div>
      <div class="fit" style="flex:0 0 auto;align-self:flex-end"><button class="ambient amb-surface amb-rounded" id="newchat" type="button">New chat</button></div>
    </div>
    <details id="system-box" class="system">
      <summary>System prompt <span id="system-state" class="note"></span></summary>
      <textarea id="system" class="ambient amb-surface-concave amb-rounded" placeholder="Instructions the model follows for every reply — optional"></textarea>
      <p class="note">Sent first with every request. Kept across reloads and new chats.</p>
    </details>
  </div>
  <div id="log"></div>
  <p class="note" id="store-note" hidden></p>
  <div class="card ambient amb-surface amb-chamfer amb-elevation-1 amb-rounded">
    <label for="prompt">Message</label>
    <textarea id="prompt" class="ambient amb-surface-concave amb-rounded" placeholder="Ask something…  (Ctrl/Cmd+Enter to send)"></textarea>
    <div class="row" style="margin-top:12px">
      <div class="note" id="chat-status"></div>
      <div class="fit"><button class="ambient amb-surface amb-rounded" id="stop" hidden>Stop</button>
      <button class="ambient amb-surface-convex amb-elevation-2 amb-rounded go" id="send">Send</button></div>
    </div>
  </div>
</section>

<section id="pane-models" hidden>
  <div class="card ambient amb-surface amb-chamfer amb-elevation-1 amb-rounded">
    <label for="repo">HuggingFace GGUF repo</label>
    <div class="row">
      <input id="repo" class="ambient amb-surface-concave amb-rounded" placeholder="Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF" spellcheck="false">
      <div class="fit"><button class="ambient amb-surface-convex amb-elevation-1 amb-rounded go" id="list">List files</button></div>
    </div>
    <p class="note" style="margin:10px 0 0">Anonymous only. Gated repos are detected before
    the download starts — a community GGUF re-upload is usually ungated.</p>
  </div>
  <div class="card ambient amb-surface amb-chamfer amb-elevation-1 amb-rounded" id="files-card" hidden>
    <div id="files"></div>
  </div>
  <div class="card ambient amb-surface amb-chamfer amb-elevation-1 amb-rounded" id="pull-card" hidden>
    <div id="pull-what" class="note"></div>
    <div class="bar ambient amb-surface-concave amb-rounded"><div id="bar"></div></div>
    <div id="pull-status" class="note"></div>
  </div>
  <div class="card ambient amb-surface amb-chamfer amb-elevation-1 amb-rounded">
    <label>Server API key <span class="note">— only needed if the server was started with -api-key</span></label>
    <input id="key" class="ambient amb-surface-concave amb-rounded" type="password" placeholder="(none)" autocomplete="off">
    <p class="note" style="margin:8px 0 0">Kept in this tab only (sessionStorage); cleared when the tab closes.</p>
  </div>
</section>
</main>

<script src="ui/markdown.js"></script>
<script src="ui/app.js"></script>
