<!-- Client-side search for the book site.

     WHY THIS FILE IS AN INCLUDE AND NOT A LAYOUT OVERRIDE. jekyll-theme-primer's
     _layouts/default.html ends its <head> by including this file by name — a documented
     extension point. Copying the whole layout in order to add two tags would fork it, and the
     fork would silently stop tracking the theme. Verified against the theme source rather than
     assumed: pages-themes/primer, _layouts/default.html.

     DO NOT WRITE THAT INCLUDE TAG OUT IN FULL ANYWHERE IN THIS FILE, not even in a comment.
     Liquid is evaluated before an HTML comment means anything, so an include tag written inside
     a comment is still executed — and since this file IS head-custom.html, naming itself makes
     it include itself. The first version of this comment did exactly that and the build died
     with "stack level too deep ... 10124 levels" pointing at the THEME's layout, which is the
     last place you would look for a bug you introduced.

     The same trap catches the fix: the escape hatch for a literal tag is Liquid's raw/endraw
     pair, and writing THAT out here would be another live tag. So this comment names neither.
     If a literal tag is ever genuinely needed in this file, wrap it in that pair rather than
     describing it.

     AND A THIRD TIME, in the sentence above this one. It used to illustrate "inside a comment"
     by writing an empty HTML comment inline — which closed THIS comment at that point, so every
     paragraph below rendered as visible text at the top of every page of the book. The rule
     generalises past Liquid: this comment may not contain a comment-close sequence either, so
     it describes delimiters in words and never spells one.

     WHY THE UI IS BUILT FROM SCRIPT RATHER THAN MARKUP. head-custom is inside <head>, so there is
     no body to attach to yet; the box is created on DOMContentLoaded and inserted at the top of
     .markdown-body, which is the container primer wraps every page in. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
  /* The site's design tokens (site/mockups, docs/tasks/task-site-2026-09.md 4a) applied to primer's .markdown-body,
     so the book and goinfer.dev read as one thing. scripts/test_book_tokens.py fails if these drift from the mockups. */
  :root {
    --ground: #eceff3; --surface: #f9fafc; --sunk: #e2e6ec; --line: #cfd5de;
    --ink: #212831; --ink-2: #48525e; --muted: #5c6672;
    --accent: #0b6fd4; --accent-soft: #d8e6f7; --on-accent: #ffffff;
    --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --f-mono: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #12161c; --surface: #1a2029; --sunk: #222a35; --line: #323c49;
      --ink: #e5e9ef; --ink-2: #b6bfca; --muted: #8a95a2;
      --accent: #4c9bef; --accent-soft: #1a2d45; --on-accent: #0b1522;
    }
  }
  html, body { background: var(--ground); }
  body { color: var(--ink); -webkit-font-smoothing: antialiased; }
  .markdown-body {
    max-width: 46rem; margin-inline: auto; background: transparent; color: var(--ink);
    font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.65;
  }
  .markdown-body a { color: var(--accent); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
    font-family: var(--f-display); color: var(--ink); letter-spacing: -.01em;
  }
  .markdown-body h1 { font-size: 2.1rem; font-weight: 800; line-height: 1.15; border-bottom: 0; margin: .4em 0 .5em; }
  .markdown-body h2 { font-size: 1.5rem; font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: .3em; }
  .markdown-body h3 { font-size: 1.15rem; font-weight: 700; }
  .markdown-body > h1:first-child {
    font-family: var(--f-mono); font-size: .78rem; font-weight: 500; letter-spacing: .06em;
    text-transform: uppercase; margin: 0 0 1.6rem;
  }
  .markdown-body > h1:first-child a { color: var(--muted); }
  .markdown-body em { color: var(--ink-2); }
  .markdown-body hr { background: var(--line); height: 1px; border: 0; }
  .markdown-body code, .markdown-body tt {
    font-family: var(--f-mono); font-size: .82em; background: var(--sunk); color: var(--ink); border-radius: 4px;
  }
  .markdown-body pre, .markdown-body .highlight, .markdown-body .highlighter-rouge, .markdown-body .highlight pre {
    background: var(--sunk); color: var(--ink); border-radius: 8px;
  }
  .markdown-body pre { border: 1px solid var(--line); }
  .markdown-body .highlight pre { border: 0; }
  .markdown-body pre code { background: none; font-size: .82rem; line-height: 1.55; }
  @media (prefers-color-scheme: dark) {
    /* rouge's token colours are tuned for a white page and lose contrast on the dark surface, so inherit the ink */
    .markdown-body .highlight span { color: inherit !important; }
  }
  .markdown-body table, .markdown-body table th, .markdown-body table td { border-color: var(--line); }
  .markdown-body table tr { background: var(--surface); border-top: 1px solid var(--line); }
  .markdown-body table tr:nth-child(2n) { background: var(--sunk); }
  .markdown-body table th { font-family: var(--f-display); }
  .markdown-body img { max-width: 100%; }
  /* the figures are SVG files with their own light palette, so they sit on a light card in either theme */
  .markdown-body img[src$=".svg"] {
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-sizing: border-box;
  }
  .markdown-body ::selection { background: var(--accent-soft); }

  .bk-search { margin: 0 0 1.5rem; }
  .bk-search input {
    width: 100%; padding: .55rem .7rem; font: inherit; font-size: 1rem; box-sizing: border-box;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  }
  .bk-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .bk-results { margin: .5rem 0 0; padding: 0; list-style: none; }
  .bk-results li { padding: .5rem 0; border-bottom: 1px solid var(--line); }
  .bk-results a { font-weight: 600; text-decoration: none; }
  .bk-ch { color: var(--muted); font-size: .85rem; margin-left: .4rem; font-weight: 400; }
  .bk-snip { display: block; color: var(--muted); font-size: .9rem; margin-top: .15rem; }
  .bk-snip mark { background: var(--accent-soft); color: var(--ink); padding: 0 .1em; }
  .bk-note { color: var(--muted); font-size: .9rem; padding: .5rem 0; }
</style>

<script>
(function () {
  // relative_url alone, quoted here, rather than `| jsonify`: this is the only Liquid in the file
  // and it is the one line no local build could exercise (Jekyll would not install on either
  // machine — a native extension in its livereload dependency fails to compile). One well-known
  // filter producing a path with nothing to escape is the smallest thing that can go wrong, and
  // if it did, Jekyll fails the build loudly on an unknown filter rather than shipping a page
  // that 404s silently in the browser.
  var INDEX_URL = "{{ '/search-index.json' | relative_url }}";

  // Ranking is deliberately crude and explainable: a heading hit outranks a body hit, and more
  // matched terms outrank fewer. Every query term must appear somewhere in the record (AND, not
  // OR) — with 90 sections over one subject, OR returns most of the book for two common words.
  function search(records, query) {
    var terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    var out = [];
    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      var hay = (r.heading + ' ' + r.text).toLowerCase();
      var head = r.heading.toLowerCase();
      var score = 0, all = true;
      for (var t = 0; t < terms.length; t++) {
        if (hay.indexOf(terms[t]) === -1) { all = false; break; }
        score += head.indexOf(terms[t]) !== -1 ? 10 : 1;
      }
      if (all) out.push({ r: r, score: score });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, 20).map(function (x) { return x.r; });
  }
  if (typeof module !== 'undefined' && module.exports) { module.exports = { search: search }; return; }

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Show the query in context rather than the first 150 characters of the section, which for a
  // book this discursive is usually preamble that does not contain the term.
  function snippet(text, terms) {
    var low = text.toLowerCase(), at = -1;
    for (var i = 0; i < terms.length && at === -1; i++) at = low.indexOf(terms[i]);
    if (at === -1) at = 0;
    var start = Math.max(0, at - 60);
    var frag = (start ? '…' : '') + text.slice(start, start + 180) + (text.length > start + 180 ? '…' : '');
    var html = esc(frag);
    terms.forEach(function (t) {
      if (!t) return;
      html = html.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
    });
    return html;
  }

  document.addEventListener('DOMContentLoaded', function () {
    var host = document.querySelector('.markdown-body');
    if (!host) return;
    var box = document.createElement('div');
    box.className = 'bk-search';
    box.innerHTML = '<input type="search" placeholder="Search the book…  (press / to focus)" ' +
                    'aria-label="Search the book" autocomplete="off"><ul class="bk-results"></ul>';
    // After the site-title <h1> the theme injects, so the box does not displace the masthead.
    var h1 = host.querySelector('h1');
    if (h1 && h1.nextSibling) host.insertBefore(box, h1.nextSibling); else host.insertBefore(box, host.firstChild);

    var input = box.querySelector('input');
    var list = box.querySelector('.bk-results');
    var records = null, pending = null;

    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
      if (e.key === 'Escape' && document.activeElement === input) { input.value = ''; render(); }
    });

    function render() {
      var q = input.value.trim();
      list.innerHTML = '';
      if (!q) return;
      if (!records) { list.innerHTML = '<li class="bk-note">loading…</li>'; return; }
      var hits = search(records, q);
      if (!hits.length) { list.innerHTML = '<li class="bk-note">No matches.</li>'; return; }
      var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      hits.forEach(function (r) {
        var li = document.createElement('li');
        li.innerHTML = '<a href="' + esc(r.url) + '">' + esc(r.heading) + '</a>' +
                       '<span class="bk-ch">' + esc(r.chapter) + '</span>' +
                       '<span class="bk-snip">' + snippet(r.text, terms) + '</span>';
        list.appendChild(li);
      });
    }

    // Fetched on first keystroke, not on load: the index is ~90 KB and most readers never search.
    function load() {
      if (records || pending) return;
      pending = fetch(INDEX_URL).then(function (r) { return r.json(); })
        .then(function (j) { records = j; render(); })
        .catch(function () { list.innerHTML = '<li class="bk-note">Search index unavailable.</li>'; });
    }
    input.addEventListener('input', function () { load(); render(); });
    input.addEventListener('focus', load);
  });
})();
</script>
