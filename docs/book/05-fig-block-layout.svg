<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 296" width="700" height="296" role="img" aria-labelledby="t6 d6">
<title id="t6">Where the bits go in group-wise int4 quantization</title>
<desc id="d6">One group of 32 weights stores 32 four-bit integers, which is 16 bytes, plus one 32-bit float scale, which is 4 bytes: 20 bytes for 32 weights, or 5.0 bits per weight rather than 4. The scale is amortized over the group, so a smaller group costs more per weight: group of 16 is 6.0 bits, 32 is 5.0, 64 is 4.5, 128 is 4.25. Against 32 bits for float32 and about 8 for int8.</desc>
<rect x="0" y="0" width="700" height="296" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" rx="6"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1f2328">4-bit weights cost 5 bits</text>
<text x="20" y="47" font-size="11.5" fill="#57606a">one group of 32, as it sits in memory</text>
