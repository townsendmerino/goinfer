<text x="523.0" y="79" font-size="11" fill="#7d4e00" text-anchor="middle">f32 scale</text>
<text x="244" y="106" font-size="11" fill="#0969da" text-anchor="middle">32 weights &#215; 4 bits = 16 bytes</text>
<text x="523.0" y="106" font-size="11" fill="#7d4e00" text-anchor="middle">+ 4 bytes</text>
<text x="20" y="128" font-size="12" fill="#1f2328"><tspan font-weight="bold">20 bytes for 32 weights</tspan> &#8212; 5.0 bits/weight, not 4</text>
<line x1="20" y1="152" x2="680" y2="152" stroke="#d0d7de" stroke-width="1"/>
<text x="20" y="174" font-size="12" font-weight="bold" fill="#1f2328">the scale is amortized, so the GROUP SIZE sets the real cost</text>
<text x="20" y="199" font-size="11" fill="#1f2328">f32</text>
<rect x="150" y="186" width="416.0" height="17" rx="2" fill="#8c959f" opacity="0.8"/>
<text x="574.0" y="199" font-size="11" fill="#57606a">32 bits/weight  </text>
<text x="20" y="221" font-size="11" fill="#1f2328">int8 (per row)</text>
<rect x="150" y="208" width="104.0" height="17" rx="2" fill="#8c959f" opacity="0.8"/>
<text x="262.0" y="221" font-size="11" fill="#57606a">8 bits/weight  </text>
<text x="20" y="243" font-size="11" fill="#1f2328">int4 group 16</text>
<rect x="150" y="230" width="78.0" height="17" rx="2" fill="#cf222e" opacity="0.8"/>
<text x="236.0" y="243" font-size="11" fill="#57606a">6 bits/weight  +2.0 for scales</text>
<text x="20" y="265" font-size="11" fill="#1f2328">int4 group 32</text>
<rect x="150" y="252" width="65.0" height="17" rx="2" fill="#1a7f37" opacity="0.8"/>
<text x="223.0" y="265" font-size="11" fill="#57606a">5 bits/weight  +1.0  &#8592; shipped</text>
<text x="20" y="287" font-size="11" fill="#1f2328">int4 group 64</text>
<rect x="150" y="274" width="58.5" height="17" rx="2" fill="#0969da" opacity="0.8"/>
<text x="216.5" y="287" font-size="11" fill="#57606a">4.5 bits/weight  +0.5</text>
