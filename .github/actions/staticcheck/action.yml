name: install-staticcheck
description: >
  Builds the pinned staticcheck from source and puts it on PATH. The pin is this directory's go.mod: staticcheck v0.8.1
  (release 2026.2.1) against golang.org/x/tools v0.51.0. Since the move to Go 1.27.2 (owner, 2026-10-08) no staticcheck
  release binary can run here: v0.8.0 and v0.8.1 read export data up to version 4 and Go 1.27.2 writes version 5, so
  they stop at "internal error in importing ..." and analyse nothing. x/tools v0.51.0's importer reads it. This costs
  the ~24 s compile C5 (docs/completed/task-ci-speed-2026-09.md) had removed by downloading the release; go back to a
  checksum-verified download once a staticcheck release reads Go 1.27.2.
inputs:
  version:
    description: >
      The staticcheck release this go.mod builds (e.g. "2026.2.1" for v0.8.1 -- staticcheck's release tags are its own
      CalVer, not the vX.Y.Z the tool reports). The build is checked against it, and cmd/gate's quick lint reads it to
      check a local staticcheck. Bump it with this directory's go.mod.
    required: true
runs:
  using: composite
  steps:
    - name: build staticcheck ${{ inputs.version }} (go.mod in .github/actions/staticcheck)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        GOWORK=off go build -C "$GITHUB_ACTION_PATH" -o "$HOME/.local/bin/staticcheck" honnef.co/go/tools/cmd/staticcheck
        got="$("$HOME/.local/bin/staticcheck" -version)"
        case "$got" in
          "staticcheck ${{ inputs.version }} "*) echo "$got" ;;
          *) echo "built $got, the workflow pins ${{ inputs.version }}: bump action.yml's callers and this go.mod together" >&2; exit 1 ;;
        esac
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
