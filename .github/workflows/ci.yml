name: ci

# ACTIONS ARE PINNED BY COMMIT SHA, NOT TAG (audit-2026-09-02.md N-41, found 2026-09-11, applied
# repo-wide across every .github/workflows/*.yml). A major-version tag like `@v4` is mutable —
# its owner (or an attacker who compromises the action repo) can move it to point at different
# code without the pin here ever changing, the exact supply-chain risk GitHub's own hardening
# guide names. Every `uses:` line reads `owner/action@<40-char-sha> # vN`, so the sha is what
# actually runs and the `# vN` comment is just for a human skimming which release that was.
# To bump: find the new tag's commit (`git ls-remote --tags https://github.com/<owner>/<action>
# <new-tag>` — verify it is NOT an annotated tag, i.e. no `^{}` peeled ref printed alongside, or
# use that peeled sha instead), replace both the sha and the trailing comment together.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# C2 (docs/completed/task-ci-speed-2026-09.md): a run superseded by a newer push on the SAME ref is
# cancelled rather than left to finish on a runner nobody will read the result of — this repo has
# real multi-commit-burst days (85 commits in two days, 2026-09-08-10). Safe to cancel mid-way
# (unlike book-pages.yml's Pages deploy, which explicitly does not): a cancelled CI run has no
# external side effect, it just stops checking a commit that is no longer the tip of the ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C3 (docs/completed/task-ci-speed-2026-09.md): change detection, at the JOB level. A push that
  # changes only files under docs/ -- and none that Go code or tests READ (scripts/ci_docs_only.sh
  # decides; 477da08a is the precedent: a docs-only env-vars.md fix flipped
  # TestEnvVars_docAndCodeAgree, so "docs-only" cannot mean "skip tests" without that read check)
  # -- runs `lint` alone. Every other job `needs:` this one and skips when docs_only == 'true'.
  #
  # It sits in front of everything, so it is the cheapest job in the file: one checkout (full
  # history -- measured 6s median here, and the diff needs github.event.before to be present) and
  # one script. FAIL-OPEN BY CONSTRUCTION, twice over: the script always exits 0 and prints
  # "false" on any doubt (bad/zero SHAs, a diff that errors, an empty diff, a failed self-check),
  # and the dependent jobs' `if:` uses !cancelled() so even a failed or missing gate runs the full
  # matrix instead of skipping it -- a plain `needs:` would skip dependents when this job fails,
  # the one outcome the gate must never produce.
  #
  # NOT a workflow-level paths-ignore: that would skip `lint` too, and the citation + book-link
  # lints are ABOUT docs and must run on exactly these pushes. (It would also leave a required
  # check Pending forever under branch protection; main has no protection and no rulesets today
  # -- checked with `gh api` 2026-09-22 -- but the job-level shape holds either way.)
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to read the BASE commit's own ci conclusion (the second condition below)
    outputs:
      docs_only: ${{ steps.gate.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # TWO conditions, both required to skip. (1) The diff is docs-only (the script). (2) The
      # commit this push builds on already has a COMPLETED, SUCCESSFUL ci run. Without (2), C2
      # and C3 combine into a coverage hole on a busy branch: a code push lands, its run is
      # in flight, a docs-only push lands on top -- C2 cancels the code push's run, C3 skips the
      # tests on the docs push, and the tip reads green with the code underneath never verified.
      # Found 2026-09-22 with exactly that shape live (two sessions pushing to main minutes
      # apart), before the gate's first docs-only probe. "You may skip the matrix only if what
      # you build on already passed it" closes it. Fail-open: any answer other than the literal
      # "success" (in_progress, cancelled, failure, no run, API error, an older gh without
      # --commit) runs everything. `--commit` wants the FULL 40-char sha -- a short one returns
      # nothing (measured), which is also the safe answer; github.event.before is always full.
      - name: docs-only push?
        id: gate
        env:
          # A PR compares against its base; a push compares against the previous tip. On branch
          # creation `before` is all zeros and the script fails open (runs everything).
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(scripts/ci_docs_only.sh "$BASE" "$HEAD")
          base_run="(not checked)"
          if [ "$v" = "true" ]; then
            base_run=$(gh run list --workflow ci.yml --commit "$BASE" --json conclusion --jq '.[0].conclusion' 2>/dev/null || true)
            if [ "$base_run" != "success" ]; then
              v=false
            fi
          fi
          echo "docs_only=$v" >> "$GITHUB_OUTPUT"
          echo "docs_only=$v  (base=$BASE head=$HEAD; base's last ci run: '${base_run:-none}')"

  # Root module: the pure-Go runtime (decoder / tokenizer / constrain / demo).
  # Resolves the published aikit from the proxy — no workspace needed.
  #
  # C1 (docs/completed/task-ci-speed-2026-09.md): split from one `root` job into `lint` (gofmt,
  # build, both vets, staticcheck, apidiff, citation lint, book link lint, cleanliness guard --
  # everything that needs the full-history checkout) and `test` (the -race suite + sampler
  # gates, shallow checkout) so both start at t=0 instead of the test step waiting behind a
  # measured ~71s median lint stretch (docs/measurements/ci-timing-2026-09.md). `test` does NOT
  # duplicate `lint`'s own gofmt/build/vet steps -- `go test` fails to compile the same way `go
  # build`/`go vet` would if something is actually broken, just surfaced inside the test job's
  # own output instead of a separate step, and `lint` is a required check regardless.
  #
  # NOTE for whoever manages branch protection: if `root` is named individually in a required-
  # status-checks list, that name-based rule needs updating to `lint` + `test` after this lands
  # -- nothing in this repo's own files can see or change that GitHub-side setting.
  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED, and only on this job — it is the one that runs the citation
      # lint, which resolves commit SHAs. The default depth-1 checkout has exactly one commit, so
      # every cited SHA fails to resolve. That is not a hypothetical: the lint went into CI at
      # 5ceb8d7 and CI was red for 15 consecutive runs before anyone looked, with the lint
      # reporting ~35 accurate citations as "fabricated" every time.
      #
      # The other jobs deliberately keep the shallow default — they run builds and tests, do not
      # touch git history, and a full clone would cost them fetch time for nothing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet -tags goinfer_testhooks ./...

      # The release parity sweep builds with `-tags realckpt`, and CI never did — so a
      # realckpt-only compile error reached main and broke the sweep before it could run a
      # single gate (f49be07: two incompatible `envOr` in one package, untagged vet clean).
      # This is COMPILE-ONLY and needs no checkpoints: the heavy tests skip without their
      # assets, but they must still type-check. Same lesson as the standalone-build gate in
      # RELEASING.md — a configuration nothing builds is a configuration that breaks silently.
      - name: vet (realckpt — the release sweep's build)
        run: go vet -tags 'realckpt goinfer_testhooks' ./...

      # staticcheck (incl. the unused/U1000 check) — mirrors the go vet tag matrix
      # across the three module jobs (no-tag / gpu / cuda). Pinned like fin/ken.
      # C5: a downloaded, checksum-verified release binary (./.github/actions/staticcheck),
      # not `go run @version` (measured 24s median compiling from source every run,
      # docs/measurements/ci-timing-2026-09.md) -- same pin (2026.2 == v0.8.0), just fetched
      # once as a binary instead of built from source on every job that needs it.
      - uses: ./.github/actions/staticcheck
        with:
          version: "2026.2" # v0.8.0
          checksum: df1fd2b42de9fdef42231329522ea8f1f6846a5eb1a0200fad14c90bba464d02
      - name: staticcheck
        run: staticcheck ./...

      # API compatibility against the SIGNED-OFF Hard tier (docs/api-tiers.md, v1.0 gate §3).
      # It runs on THIS job because it needs the full history the citation lint already requires:
      # the baseline is a git TAG, and a shallow clone has none. A missing tag exits non-zero
      # rather than passing — "could not compare" must never read as "nothing changed".
      #
      # It fails ONLY on incompatible changes to Hard-tier names. The residency seam, family
      # descriptors and drafters are named Experimental in that document precisely because they
      # move as families land; a gate that failed on those would be switched off within a minor,
      # and a switched-off gate is worse than none.
      # v0.13.0 is a deliberately FROZEN baseline (the pre-1.0 API-freeze point), not "the last
      # release" — several tags have shipped since (N-54, docs/audit-2026-09-10.md: this step's
      # own name used to claim otherwise).
      - name: apidiff (Hard tier vs the v0.13.0 API-freeze baseline)
        run: scripts/apidiff_check.sh v0.13.0

      # The lint resolves aikit/gpu path citations against cuda/go.mod's required version (B10:
      # aikit and aikit/gpu are separate modules with separate tag series). The root module's
      # go.mod does NOT require aikit/gpu (M-19 — only cuda/gpu/metal do), so root's own
      # `go build ./...` above never populates it in the module cache, and the lint hard-fails
      # with "CANNOT SEARCH" on every aikit/gpu citation. Downloading cuda's deps here (into the
      # same shared GOMODCACHE) is what actually gives the lint something to search.
      - name: populate module cache for cross-repo citations (aikit/gpu)
        run: cd cuda && go mod download

      # Content keys make a stale citation DETECTABLE on the next sweep; they do not prevent one.
      # Here it goes red in the commit that makes the entry stale — while someone is already in that
      # code — which is the difference between the F group happening again and not. Citations whose
      # repo is not checked out here are a counted skip naming the repo, never a silent pass.
      - name: queue citation lint
        run: python3 scripts/queue_citation_lint.py

      # The book links into this repo's own source with ABSOLUTE GitHub blob URLs,
      # because docs/book/ is also published to Pages where the Jekyll build flattens
      # the directory and a relative ../../decoder/model.go resolves to nothing. Those
      # links rot on rename, silently and with no syntax error to notice.
      #
      # It runs HERE rather than in book-pages.yml on purpose: that workflow triggers on
      # `docs/book/**` only, so a rename in decoder/ would never fire it and the book
      # would keep publishing green with dead links. The break originates outside the
      # book, so the check has to live where every push runs.
      #
      # Fails on a vacuous scan too — a link checker that matches nothing looks exactly
      # like one that found nothing wrong.
      - name: book link lint
        run: python3 scripts/book_link_lint.py

      # C3's zero-match guard: the `changes` gate decides "docs-only" partly by detecting which
      # docs/ files Go tests READ (scripts/ci_docs_only.sh). If that detection ever stops seeing
      # a file a test is known to read, the gate has silently widened what gets skipped -- this
      # step makes that a red `lint` on every push instead. Same shape as the sampler-gates
      # zero-match guard in `test`.
      - name: docs-only gate self-check (zero-match guard)
        run: scripts/ci_docs_only.sh --selfcheck

      # Core promise: the cgo WebGPU/CUDA/Metal deps must never enter the runtime's
      # module graph. They live only in the opt-in ./gpu, ./cuda, ./metal submodules,
      # reached through their own cmd/ entrypoints (audit M-19) — never blank-imported
      # from a root package.
      #
      # TWO checks, because -deps and -m see different things (audit M-19):
      #   1. go list -deps  — the COMPILED package set (what actually links). Catches a
      #      backend imported under the default build.
      #   2. go list -m all — the MODULE GRAPH a consumer resolves (`go install`, SBOM,
      #      vuln scanners). A tag-gated blank import leaks here even though -deps stays
      #      clean, so a pure-Go `go install .../cmd/serve` used to pull webgpu/purego/
      #      gocudrv. This second check is the one that regresses if a root package
      #      blank-imports a submodule again.
      - name: cleanliness guard (no webgpu / cuda / metal in root)
        run: |
          leak='cogentcore/webgpu|eitamring/gocudrv|ebitengine/purego|townsendmerino/aikit/gpu|townsendmerino/goinfer/(gpu|cuda|metal)'
          if go list -deps ./... | grep -Eiq "$leak"; then
            echo "::error::an opt-in backend dep leaked into the compiled root package set"
            go list -deps ./... | grep -Ei "$leak"
            exit 1
          fi
          if go list -m all | grep -Eiq "$leak"; then
            echo "::error::an opt-in backend module leaked into the root module graph (a root package blank-imports a submodule? move it to <submodule>/cmd/)"
            go list -m all | grep -Ei "$leak"
            exit 1
          fi
          echo "clean: no webgpu/gocudrv/purego/aikit-gpu/submodules in the goinfer root (packages or module graph)"

  # C1's other half: the -race suite + sampler gates, split out of `lint` so both start at t=0.
  # Shallow (default depth-1) checkout -- this job never touches git history, only source at HEAD.
  # A `go test` compile failure surfaces here too (it builds what it tests), so this job is not
  # missing fast-fail coverage by not repeating `lint`'s own gofmt/build/vet steps -- it just
  # surfaces a compile error inside `test`'s own output instead of a dedicated step, and `lint`
  # (which DOES run those as fast, separate, clearly-named steps) is a required check regardless.
  # C9 (docs/completed/task-ci-speed-2026-09.md): `./decoder` was the single long pole of the old
  # `test` job (562s of it after C8, against everything else summing to 255s and finishing
  # underneath it) and C7 established it cannot be cached away (t.TempDir() in 21 files makes the
  # whole package's cache key unstable on every run, on any machine -- see the C7 section). The
  # only lever left is running its ~691 top-level tests across more than the one core they get
  # inside a job with only a handful of t.Parallel() calls. `./decoder` splits into four shards by
  # an LPT (longest-processing-time-first) bin-pack of the 14 heaviest named tests plus the
  # no-race sampler-gates step (real per-test seconds from C7's own instrument, run 35767702617,
  # 2026-09-22) -- max bucket 167.0s against a 163.15s ideal average, i.e. within 4.3% of optimal
  # for 4 bins. A fifth shard runs everything NOT explicitly named elsewhere via `-skip` (~27s: the
  # other ~677 tests are collectively cheap), and a sixth runs the REST of `./...` (`internal/
  # serveapp` 121s is its own long pole). Each shard restores the SAME rolling build cache (C7)
  # under its own key, falling back to the others' and finally to the pre-C9 unsharded key, so
  # every shard gets full BUILD-cache reuse (compiling ./decoder under -race is the same work
  # regardless of -run/-skip) even though the TEST-result cache stays package-wide and decoder's
  # own entries still never hit.
  #
  # MAINTENANCE. A renamed heavy test silently drops out of its assigned shard and falls into the
  # tail shard instead (`-skip`'s complement is "everything else" by construction) -- a BALANCE
  # regression, not a coverage one: nothing is silently skipped, because the tail's `-skip` pattern
  # is the exact complement of every name used elsewhere, so a test is always caught by exactly one
  # of the five `./decoder` shards. A DELETED test would make its shard's `-run` pattern match
  # nothing, which is the exact zero-match trap `sampler_selection_test.go`'s own comment
  # documents (`go test -run` on a non-matching pattern exits 0, not red) -- each shard below that
  # names specific tests carries the same zero-match guard as the sampler-gates step for that
  # reason. If shard wall times drift far apart, re-derive from `ci_test_summary.py`'s
  # slowest-tests output and redo the LPT pack by hand; this is not automated.
  test-decoder-a:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-decoder-a-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-decoder-a-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-decoder-a-
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Bucket B1, 167.0s alone -- the single heaviest test (LPT put nothing else with it).
      - name: shard exists (zero-match guard)
        run: |
          pattern='TestSampleFromTopK_matchesFullPath'
          matched=$(go test -list "$pattern" ./decoder/ | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true)
          if [ -z "$matched" ]; then
            echo "::error::pattern '$pattern' matched NO test in ./decoder/ — renamed or deleted? the next step would silently run nothing"
            exit 1
          fi
      - name: test (decoder shard a)
        run: go test -race -timeout 25m -tags goinfer_testhooks -json -run 'TestSampleFromTopK_matchesFullPath' ./decoder/ > test.json
      - name: test summary
        if: always()
        run: |
          python3 scripts/ci_test_summary.py test.json --top 40 || {
            echo "::error::ci_test_summary.py failed; raw build/fail events follow"
            grep -E '"Action":"(build-output|build-fail|fail)"' test.json | head -300
            exit 1
          }

  test-decoder-b:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-decoder-b-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-decoder-b-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-decoder-b-
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Bucket B2, 160.1s: TestSample_DrawIdentity (36.3s) + TestEnvVars_docAndCodeAgree (5.8s)
      # under -race, PLUS the no-race sampler-gates step (118s) this shard was built around --
      # the two sweeps' EXHAUSTIVE form (C8: the -race build strides both), the throughput ratio
      # gate (a wall-clock ratio measured under -race measures the detector, not the code), and
      # the coverage self-check. TestSweepCoverage_fullSweepRunsSomewhere reads this whole FILE
      # for a non-race `go test` line naming both strided sweeps -- unaffected by which job the
      # line lives in.
      - name: shard exists (zero-match guard)
        run: |
          pattern='TestSample_DrawIdentity|TestEnvVars_docAndCodeAgree'
          matched=$(go test -list "$pattern" ./decoder/ | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true)
          if [ -z "$matched" ]; then
            echo "::error::pattern '$pattern' matched NO test in ./decoder/ — renamed or deleted? the next step would silently run nothing"
            exit 1
          fi
      - name: test (decoder shard b)
        run: go test -race -timeout 25m -tags goinfer_testhooks -json -run 'TestSample_DrawIdentity|TestEnvVars_docAndCodeAgree' ./decoder/ > test.json
      - name: test summary
        if: always()
        run: |
          python3 scripts/ci_test_summary.py test.json --top 40 || {
            echo "::error::ci_test_summary.py failed; raw build/fail events follow"
            grep -E '"Action":"(build-output|build-fail|fail)"' test.json | head -300
            exit 1
          }
      # ZERO-MATCH GUARD (audit-2026-09-10.md, found 2026-09-11): `go test -run '<pattern>'`
      # exits 0 and prints `ok ... [no tests to run]` when the pattern matches NOTHING —
      # verified directly (`go test -run 'DoesNotExist12345' ./decoder/` -> `ok`, exit 0). A
      # renamed/deleted test here would report green while running none of these four gates.
      - name: sampler gates exist (zero-match guard)
        run: |
          pattern='TestTopFilterLogits_MatchesReference|TestSampleFromTopK_matchesFullPath|TestSample_DrawIdentity|TestSamplingThroughputGate|TestSweepCoverage'
          matched=$(go test -list "$pattern" ./decoder/ | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true)
          if [ -z "$matched" ]; then
            echo "::error::pattern '$pattern' matched NO test in ./decoder/ — renamed or deleted? the next step would silently report green running nothing"
            exit 1
          fi
          echo "matched:"
          echo "$matched"
      - name: sampler gates (no -race)
        run: go test -count=1 -run 'TestTopFilterLogits_MatchesReference|TestSampleFromTopK_matchesFullPath|TestSample_DrawIdentity|TestSamplingThroughputGate|TestSweepCoverage' ./decoder/

  test-decoder-c:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-decoder-c-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-decoder-c-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-decoder-c-
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Bucket B3, 162.1s: TestTopFilterLogits_MatchesReference (84.8) + TestSampleFromTopK_
      # deviceRoundedZ (46.7) + TestChunkedSoftmax_MatchesReference (9.8) + TestTopK1_
      # MatchesGreedy (9.4) + TestGumbelDraw_edgeRows (6.4) + TestChunkedSoftmax_
      # MachineIndependent (5.0).
      - name: shard exists (zero-match guard)
        run: |
          pattern='TestTopFilterLogits_MatchesReference|TestSampleFromTopK_deviceRoundedZ|TestChunkedSoftmax_MatchesReference|TestTopK1_MatchesGreedy|TestGumbelDraw_edgeRows|TestChunkedSoftmax_MachineIndependent'
          matched=$(go test -list "$pattern" ./decoder/ | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true)
          if [ -z "$matched" ]; then
            echo "::error::pattern '$pattern' matched NO test in ./decoder/ — renamed or deleted? the next step would silently run nothing"
            exit 1
          fi
      - name: test (decoder shard c)
        run: go test -race -timeout 25m -tags goinfer_testhooks -json -run 'TestTopFilterLogits_MatchesReference|TestSampleFromTopK_deviceRoundedZ|TestChunkedSoftmax_MatchesReference|TestTopK1_MatchesGreedy|TestGumbelDraw_edgeRows|TestChunkedSoftmax_MachineIndependent' ./decoder/ > test.json
      - name: test summary
        if: always()
        run: |
          python3 scripts/ci_test_summary.py test.json --top 40 || {
            echo "::error::ci_test_summary.py failed; raw build/fail events follow"
            grep -E '"Action":"(build-output|build-fail|fail)"' test.json | head -300
            exit 1
          }

  test-decoder-d:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-decoder-d-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-decoder-d-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-decoder-d-
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Bucket B4, 163.4s: the Gumbel trio (67.0 + 48.4 + 38.1) + TestDistVectorHistMatchesSampler
      # (5.9) + TestChunkedSoftmax_ChunkBoundaryDraws (4.0).
      - name: shard exists (zero-match guard)
        run: |
          pattern='TestGumbelDraw_largeVocabTailAndHead|TestGumbelDraw_equivalentToLegacyDistribution|TestGumbelDraw_goodnessOfFit|TestDistVectorHistMatchesSampler|TestChunkedSoftmax_ChunkBoundaryDraws'
          matched=$(go test -list "$pattern" ./decoder/ | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true)
          if [ -z "$matched" ]; then
            echo "::error::pattern '$pattern' matched NO test in ./decoder/ — renamed or deleted? the next step would silently run nothing"
            exit 1
          fi
      - name: test (decoder shard d)
        run: go test -race -timeout 25m -tags goinfer_testhooks -json -run 'TestGumbelDraw_largeVocabTailAndHead|TestGumbelDraw_equivalentToLegacyDistribution|TestGumbelDraw_goodnessOfFit|TestDistVectorHistMatchesSampler|TestChunkedSoftmax_ChunkBoundaryDraws' ./decoder/ > test.json
      - name: test summary
        if: always()
        run: |
          python3 scripts/ci_test_summary.py test.json --top 40 || {
            echo "::error::ci_test_summary.py failed; raw build/fail events follow"
            grep -E '"Action":"(build-output|build-fail|fail)"' test.json | head -300
            exit 1
          }

  test-decoder-tail:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-decoder-tail-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-decoder-tail-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-decoder-tail-
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Everything NOT named in shards a/b/c/d: -skip's complement, by construction, so nothing
      # can silently fall through a gap the way a `-run` typo could -- ~677 tests, ~27s combined
      # (measured: 562.0s package total minus the 14 named tests' own 534.6s).
      - name: test (decoder shard tail)
        run: go test -race -timeout 25m -tags goinfer_testhooks -json -skip 'TestSampleFromTopK_matchesFullPath|TestSample_DrawIdentity|TestEnvVars_docAndCodeAgree|TestTopFilterLogits_MatchesReference|TestSampleFromTopK_deviceRoundedZ|TestChunkedSoftmax_MatchesReference|TestTopK1_MatchesGreedy|TestGumbelDraw_edgeRows|TestChunkedSoftmax_MachineIndependent|TestGumbelDraw_largeVocabTailAndHead|TestGumbelDraw_equivalentToLegacyDistribution|TestGumbelDraw_goodnessOfFit|TestDistVectorHistMatchesSampler|TestChunkedSoftmax_ChunkBoundaryDraws' ./decoder/ > test.json
      - name: test summary
        if: always()
        run: |
          python3 scripts/ci_test_summary.py test.json --top 40 || {
            echo "::error::ci_test_summary.py failed; raw build/fail events follow"
            grep -E '"Action":"(build-output|build-fail|fail)"' test.json | head -300
            exit 1
          }

  test-rest:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-rest-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-rest-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-rest-
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      # Every package under ./... EXCEPT ./decoder -- computed via `go list`, not a hardcoded
      # list, so a new package is covered automatically. internal/serveapp (121s) is this shard's
      # own long pole; the other 19 packages finish underneath it (go test's own package-level
      # parallelism, unchanged from before this split). This is the ONLY shard that still benefits
      # from C7's cache the way the doc originally hoped -- these packages don't carry decoder's
      # t.TempDir() instability, so a push that doesn't touch them replays this whole job from
      # cache (confirmed in CI: cmd/serve, internal/giw, internal/pullcmd, internal/servecheck all
      # showed (cached) already, at the old unsharded key).
      - name: test (everything but decoder)
        run: |
          pkgs=$(go list ./... | grep -v '^github.com/townsendmerino/goinfer/decoder$')
          go test -race -timeout 25m -tags goinfer_testhooks -json $pkgs > test.json
      - name: test summary
        if: always()
        run: |
          python3 scripts/ci_test_summary.py test.json --top 40 || {
            echo "::error::ci_test_summary.py failed; raw build/fail events follow"
            grep -E '"Action":"(build-output|build-fail|fail)"' test.json | head -300
            exit 1
          }

  # GPU submodule: the opt-in WebGPU backend, built under -tags gpu (cgo).
  # It imports the as-yet-unpublished goinfer root, so we stitch an ephemeral
  # workspace (the committed repo has none — go.work is gitignored). Once
  # goinfer is tagged, bump gpu/go.mod's goinfer require to the real version
  # and these workspace steps become unnecessary.
  readme-smoke:
    name: readme-smoke (a stranger's install, from an empty dir)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3 (root README.md is NOT docs/, so a README push still runs this)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: 'go.mod' }
      # Runs the README's <!-- smoke --> commands in a temp dir OUTSIDE the checkout with
      # GOWORK=off, then BUILDS against what they installed. The build step is the one that
      # matters: `go get github.com/townsendmerino/goinfer` exits 0 and still leaves you unable
      # to compile, which is how v0.16.0 shipped an install line that did not work
      # (docs/measurements/cold-user-2026-09-06.md, scenario C). Verified to go red on that line.
      - name: readme-smoke
        run: bash scripts/readme_smoke.sh README.md

  gpu:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: gpu/go.sum

      # cogentcore/webgpu (wgpu-native) cgo build deps for Linux.
      - name: install GPU build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      # Stitch root + gpu into an ephemeral workspace so `./gpu/...` resolves
      # the unpublished goinfer root from this checkout. The workspace's `use .`
      # provides that local resolution — the submodule go.mods are replace-free
      # (2026-08-15; a committed replace broke `go install …@vX`), so `go work init`
      # is what resolves the root, not a replace.
      - name: workspace (resolve unpublished goinfer locally)
        run: go work init . ./gpu ./demo/agent

      - name: build -tags gpu
        run: go build -tags 'gpu goinfer_testhooks' ./gpu/...

      # demo/agent is the fifth module and had ZERO CI coverage — the MCP-SDK demo compiled for
      # the first time at tag time, by a human running RELEASING.md Step 2 by hand (M-34). It
      # builds inside the workspace here, which catches ordinary breakage; the standalone
      # (GOWORK=off) build that the release actually depends on is in standalone-build.yml,
      # which runs at tag time because it CANNOT pass between releases — a module built outside
      # a workspace resolves the root from the proxy at its last published tag.
      - name: build demo/agent (workspace)
        run: go build ./demo/agent/...

      # N-61 (docs/audit-2026-09-10.md): the build step above never ran the module's own tests —
      # `go test ./...` at root cannot reach a module with its own go.mod, so n26_test.go's
      # security-hardening assertions (N-26: cross-origin, unbounded body, special-token
      # forgery) had zero CI coverage. Fast (<1s) and asset-free — no reason not to run it here.
      - name: test demo/agent (workspace)
        run: go test ./demo/agent/...

      # Compile the WIRED serve + demo entrypoints (gpu/cmd/serve, gpu/cmd/chat): the
      # RegisterBackend blank-imports live in the submodule cmd/ mains since audit M-19, so a
      # backend signature drift must fail CI here (it once broke the shipped -tags gpu binary
      # while CI stayed green — audit M-18). Covered by ./gpu/... above, but kept explicit.
      - name: build -tags gpu (wired serve + demo entrypoints)
        run: go build -tags 'gpu goinfer_testhooks' ./gpu/cmd/serve ./gpu/cmd/chat

      - name: vet -tags gpu
        run: go vet -tags 'gpu goinfer_testhooks' ./gpu/...

      # C5: pinned release binary, not `go run @version` -- see .github/actions/staticcheck.
      - uses: ./.github/actions/staticcheck
        with:
          version: "2026.2" # v0.8.0
          checksum: df1fd2b42de9fdef42231329522ea8f1f6846a5eb1a0200fad14c90bba464d02
      - name: staticcheck -tags gpu
        run: staticcheck -tags 'gpu goinfer_testhooks' ./gpu/...

      # GPU tests skip cleanly with no adapter (headless runner); this confirms
      # they compile and the resident-matmul path is exercised where possible.
      - name: test -tags gpu
        run: go test -short -tags 'gpu goinfer_testhooks' ./gpu/...

  # CUDA submodule: the opt-in cgo-free NVIDIA backend, built under -tags cuda
  # (CGO_ENABLED=0, dlopen libcuda, driver-JIT of embedded PTX). No CUDA toolkit
  # or GPU needed to BUILD — only to run; the equivalence gate (TestBackendResident-
  # Wired / TestRealForwardParity) runs on the box, and skips cleanly on the
  # GPU-less CI runner. Mirrors the gpu job: ephemeral `go work init` stitches the
  # unpublished goinfer root locally (submodule go.mods are replace-free since 2026-08-15).
  cuda:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: cuda/go.sum

      - name: workspace (resolve unpublished goinfer locally)
        run: go work init . ./cuda

      - name: build -tags cuda (backend module)
        run: CGO_ENABLED=0 go build -tags 'cuda goinfer_testhooks' ./cuda/...

      # The wired binaries must compile with the cuda backend registered (cuda/cmd/* since M-19).
      - name: build -tags cuda (wired serve + demo entrypoints)
        run: CGO_ENABLED=0 go build -tags 'cuda goinfer_testhooks' ./cuda/cmd/serve ./cuda/cmd/chat

      - name: vet -tags cuda
        run: go vet -tags 'cuda goinfer_testhooks' ./cuda/...

      # C5: pinned release binary, not `go run @version` -- see .github/actions/staticcheck.
      # CGO_ENABLED=0 dropped here: it only affects Go compilation (go build/run/test), and this
      # is now a prebuilt binary invocation, not a `go run` -- the env var had no effect on the
      # binary's own analysis of the cuda module either way.
      - uses: ./.github/actions/staticcheck
        with:
          version: "2026.2" # v0.8.0
          checksum: df1fd2b42de9fdef42231329522ea8f1f6846a5eb1a0200fad14c90bba464d02
      - name: staticcheck -tags cuda
        run: staticcheck -tags 'cuda goinfer_testhooks' ./cuda/...

      # Compile + skip cleanly on the GPU-less runner (tests t.Skip without a device).
      - name: test -tags cuda
        run: CGO_ENABLED=0 go test -short -tags 'cuda goinfer_testhooks' ./cuda/...

  # Root module on darwin/arm64. The Linux jobs above can't catch
  # platform-specific build breaks — e.g. a syscall the darwin syscall package
  # lacks under a too-broad `//go:build unix` (see decoder/madvise_*.go). This
  # job exists so that class of break fails CI instead of surfacing only in a
  # manual Apple-silicon sweep. macos-latest is Apple Silicon (arm64).
  root-darwin:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3: no macOS runner starts for a docs-only push
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # C7: replaced by the rolling cache below
      # C7: the same rolling build+test cache as the linux `test` job (the comment there is the
      # explanation); darwin's default GOCACHE is ~/Library/Caches/go-build. runner.os is part of
      # the key, so the two never restore each other's objects.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-

      - name: build
        run: go build ./...

      - name: vet
        run: go vet -tags goinfer_testhooks ./...

      # Model-asset parity tests self-skip without their checkpoints, so this is
      # green and fast on a fresh checkout (the heavy 12B parity only runs where
      # assets are present, e.g. the local sweep box). Race detector on.
      #
      # C4 (docs/completed/task-ci-speed-2026-09.md): NO -race here, per push. Owner decision
      # 2026-09-22 after measurement: this job's stated purpose is darwin-specific BUILD breaks
      # (a `//go:build unix` too broad, decoder/madvise_*.go) plus the arm64 NEON/DotProd kernels
      # the linux runner never executes -- both of which a plain `go test` covers. The -race
      # twin of the suite already runs on every push in the linux `test` job, and the detector
      # only sees code that EXECUTES, so darwin -race adds coverage only for the darwin/arm64-only
      # Go files -- real, small, slow-changing, and now run weekly instead (race-weekly.yml).
      # First attempt was `-short` (keeping -race): measured a NULL -- darwin decoder 1295s with
      # -short vs 1086s without, the exhaustive sweeps that cost the time never check
      # testing.Short() -- and it reduced coverage for nothing, so it was reverted the same day.
      # Dropping -race is the lever that actually moves this job (~3x): C0 measured -race darwin
      # at ~1290s median, all of it ./decoder, and it was the workflow's wall-time long pole.
      - name: test
        # -timeout 25m kept from the -race era (the default is 10m PER PACKAGE; ./decoder was the
        # package that tripped it) -- generous now without the detector, but a hang still fails.
        run: go test -timeout 25m -tags goinfer_testhooks ./...

  # GPU submodule on darwin/arm64 — the resident Metal decode path. Same
  # ephemeral-workspace stitch as the Linux gpu job, but no apt deps: Metal is a
  # system framework on macOS (linked via Xcode CLT, present on the runner).
  # Tests skip cleanly with no usable adapter; the build/vet alone compile-check
  # the cgo Metal path that the Linux jobs never touch.
  gpu-darwin:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: gpu/go.sum

      - name: workspace (resolve unpublished goinfer locally)
        run: go work init . ./gpu

      - name: build -tags gpu
        run: go build -tags 'gpu goinfer_testhooks' ./gpu/...

      # Wired serve + demo compile-check on darwin too (audit M-18) — see the linux gpu job.
      - name: build -tags gpu (wired serve + demo entrypoints)
        run: go build -tags 'gpu goinfer_testhooks' ./gpu/cmd/serve ./gpu/cmd/chat

      - name: vet -tags gpu
        run: go vet -tags 'gpu goinfer_testhooks' ./gpu/...

      - name: test -tags gpu
        run: go test -short -tags 'gpu goinfer_testhooks' ./gpu/...

  # cgo-free Metal module (metal/) on darwin/arm64 — the purego-objc resident decode + f16-MMA
  # prefill kernels. It is its OWN module (metal/go.mod, `replace ../`), so NEITHER the root nor
  # the gpu jobs compile it: before this job the entire Metal backend had ZERO CI coverage. That
  # is precisely why a shipped-path prefill NaN and three stale kernel bindings (rope's rhalf,
  # swiglu's act, attention's window — all buffer-index drift after a kernel gained a param) were
  # invisible until a hand-run. build + vet are the point: they compile-check every dispatch
  # against the current kernel signatures, the exact class that was silent. The device parity
  # gates need a real adapter and skip without one (real-checkpoint gates also need models); the
  # device-INDEPENDENT falsifiability test (TestParity_NaNCosineFailsTheGate) runs here. The full
  # correctness gate remains `go run ./cmd/gate gpu`, hand-run on a Metal box.
  metal-darwin:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }} # C3
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: metal/go.sum

      # metal/go.mod `require`s the unpublished root (N-54, docs/audit-2026-09-10.md: this used to
      # say the reverse) but has no `replace` for it, so a standalone build resolves the root from
      # the module proxy at whatever version is required — not this checkout's own tree. The
      # workspace supplies the LOCAL root module instead — same ephemeral stitch as gpu-darwin
      # (go.work is gitignored).
      - name: workspace (resolve unpublished goinfer locally)
        run: go work init . ./metal

      - name: build (metal module)
        run: go build ./metal/...

      # Compile the WIRED serve + demo entrypoints (metal/cmd/{serve,chat,gemma}): the
      # RegisterBackend blank-imports live in the metal submodule cmd/ mains since audit M-19
      # (darwin-gated; the metal module registers on plain darwin, so no `metal` tag needed).
      # A backend signature drift must fail CI here — it once broke the shipped metal binary
      # while CI stayed green (audit M-18). Covered by ./metal/... above, but kept explicit.
      - name: build metal (wired serve + demo entrypoints)
        run: go build ./metal/cmd/serve ./metal/cmd/chat ./metal/cmd/gemma

      - name: vet (metal module)
        run: go vet ./metal/...

      # G-02: the untagged vet above compiles NONE of the 59 files behind
      # `//go:build darwin && goinfer_testhooks` -- 64 test funcs including every
      # Metal resident-parity gate (TestDenseResidentParity, TestGemma4MoE_residentParity,
      # TestQwen35ResidentParityMetal, TestMellumResidentParity, TestGptOssResidentParityReal20B,
      # TestGemma4Paging_bitExact, ...). A type error in any of them was invisible
      # until someone hand-ran with the tag. vet COMPILES without running, so this
      # is device-free and safe on the runner whose Metal layer SIGSEGVs.
      - name: vet (metal module, testhooks-tagged — compiles the 59 device-test files)
        run: go vet -tags goinfer_testhooks ./metal/...

      # DEVICE TESTS CANNOT RUN HERE. The macos-latest runner's paravirtual Metal/objc layer
      # SIGSEGVs inside purego's objc_msgSend the moment a test touches the device (measured: a
      # near-null crash in objc.ID.Send), and that abort takes the whole test binary down — so we
      # cannot even let the package's device tests attempt-and-skip. We run ONLY the device-FREE
      # falsifiability gate, which asserts the NaN<minCos guard fails on degenerate output using no
      # GPU and no checkpoint. Everything device-bound is gated by `go run ./cmd/gate gpu` on a real
      # Metal box; build+vet above are the CI compile-check.
      # ZERO-MATCH GUARD (audit-2026-09-10.md, found 2026-09-11): same risk as the sampler-gates
      # step above, and worse here — this is the ONLY test this job runs (everything else would
      # SIGSEGV the runner), so a renamed/deleted TestParity_NaNCosineFailsTheGate would report
      # green while running literally nothing, with no other step in this job to catch it.
      - name: falsifiability gate exists (zero-match guard)
        run: |
          matched=$(go test -list 'TestParity_NaNCosineFailsTheGate' ./metal/... | grep -E '^[A-Za-z_][A-Za-z0-9_]*$' || true)
          if [ -z "$matched" ]; then
            echo "::error::TestParity_NaNCosineFailsTheGate matched NOTHING in ./metal/... — renamed or deleted? the next step would silently report green running nothing, and it is the ONLY test this job runs"
            exit 1
          fi
      - name: test (device-free falsifiability gate only — the runner's Metal layer SIGSEGVs)
        run: go test -run 'TestParity_NaNCosineFailsTheGate' ./metal/...
