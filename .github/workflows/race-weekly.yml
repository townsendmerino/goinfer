name: race-weekly

# The darwin/arm64 race-detector run, weekly instead of per push (owner decision, 2026-09-22;
# docs/completed/task-ci-speed-2026-09.md C4). The per-push `root-darwin` job in ci.yml keeps
# `go test ./...` WITHOUT -race: that still compiles every test file on arm64 (the darwin-specific
# build breaks the job exists for), still exercises the arm64 NEON/DotProd kernels the linux
# runner never runs, and is ~3x faster than the -race form (C0 measured -race darwin at
# ~1290s median, all of it the decoder package).
#
# Why weekly is enough: the race detector only sees code that EXECUTES, and the linux `test`
# job already runs the identical suite under -race on every push. What darwin -race adds is
# races in the darwin/arm64-only Go files (decoder/madvise_darwin.go, hostram_darwin.go, the
# _arm64 Go paths) -- real, small, slow-changing: weekly-sized, like fuzz-weekly's reasoning.
#
# Reporting: same as fuzz-weekly -- the run itself goes red; nothing opens an issue (that would
# need `issues: write`). Check with `gh run list --workflow race-weekly.yml`. "Red does not
# announce itself" applies here exactly as it does to every other scheduled workflow.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC (an hour after fuzz-weekly, not on top of it)
  workflow_dispatch: # and on demand

permissions:
  contents: read

jobs:
  # One process cannot hold ./decoder under -race inside a test timeout on a darwin runner, so ./decoder runs as ci.yml's
  # per-push -race job runs it: the two decision-census steps, shard b and the -skip tail, each its own leg and process,
  # with the rest of the module in a fifth leg beside them. The tail's -skip is ci.yml's test-decoder-tail pattern, checked
  # equal below, so a test is caught by exactly one decoder leg; each -run leg keeps its zero-match guard.
  race-darwin:
    name: darwin/arm64 -race (${{ matrix.leg }})
    runs-on: macos-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: decoder census
            run: '^TestDecisionCensus$|^TestDecisionCensus_twoRunsAgree$'
            want: 2
          - leg: decoder census second process
            run: '^TestDecisionCensus_secondProcess$'
          - leg: decoder shard b
            run: 'TestSample_DrawIdentity|TestEnvVars_docAndCodeAgree'
          - leg: decoder tail
            skip: 'TestSampleFromTopK_matchesFullPath|TestSample_DrawIdentity|TestEnvVars_docAndCodeAgree|TestTopFilterLogits_MatchesReference|TestSampleFromTopK_deviceRoundedZ|TestChunkedSoftmax_MatchesReference|TestTopK1_MatchesGreedy|TestGumbelDraw_edgeRows|TestChunkedSoftmax_MachineIndependent|TestGumbelDraw_largeVocabTailAndHead|TestGumbelDraw_equivalentToLegacyDistribution|TestGumbelDraw_goodnessOfFit|TestDistVectorHistMatchesSampler|TestChunkedSoftmax_ChunkBoundaryDraws|^TestDecisionCensus$|^TestDecisionCensus_twoRunsAgree$|^TestDecisionCensus_secondProcess$'
          - leg: rest of the module
            rest: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: tail matches ci.yml's (drift guard)
        if: matrix.skip != ''
        env:
          SKIP: ${{ matrix.skip }}
        run: |
          theirs=$(awk '/^  test-decoder-tail:/{f=1} f && /go test -race/ {print; exit}' .github/workflows/ci.yml | sed -E "s/.* -skip '([^']*)' .*/\1/")
          if [ "$theirs" != "$SKIP" ]; then
            echo "::error::the decoder tail's -skip differs from ci.yml's test-decoder-tail; copy it across"
            echo "ci.yml: $theirs"
            echo "here:   $SKIP"
            exit 1
          fi
      - name: leg exists (zero-match guard)
        if: matrix.run != ''
        env:
          PATTERN: ${{ matrix.run }}
          WANT: ${{ matrix.want }}
        run: |
          if ! listed=$(go test -list "$PATTERN" -tags goinfer_testhooks ./decoder/ 2>&1); then
            echo "::error::go test -list failed on ./decoder/: a build failure, not a missing test"
            echo "$listed"
            exit 1
          fi
          n=$(echo "$listed" | grep -cE '^[A-Za-z_][A-Za-z0-9_]*$' || true)
          if [ "$n" = 0 ] || { [ -n "$WANT" ] && [ "$n" != "$WANT" ]; }; then
            echo "::error::pattern '$PATTERN' matched $n test(s) in ./decoder/, want ${WANT:-at least 1} (renamed or deleted?)"
            echo "$listed"
            exit 1
          fi

      # No -short (C4 measured -short as a null on darwin: the exhaustive sweeps that cost the time never check
      # testing.Short()). A weekly run has no critical path to protect, so each leg's timeout has margin.
      - name: test -race (darwin/arm64)
        id: test
        env:
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
          REST: ${{ matrix.rest }}
        run: |
          if [ "$REST" = true ]; then
            pkgs=$(go list ./... | grep -v -e '^github.com/townsendmerino/goinfer/decoder$')
            go test -race -timeout 50m -tags goinfer_testhooks -json $pkgs > test.json
          elif [ -n "$RUN" ]; then
            go test -race -timeout 50m -tags goinfer_testhooks -json -run "$RUN" ./decoder/ > test.json
          else
            go test -race -timeout 50m -tags goinfer_testhooks -json -skip "$SKIP" ./decoder/ > test.json
          fi
      - name: test summary
        if: always() && steps.test.outcome != 'skipped'
        run: |
          python3 scripts/ci_test_summary.py test.json --top 40 || {
            echo "::error::ci_test_summary.py failed; raw build/fail events follow"
            grep -E '"Action":"(build-output|build-fail|fail)"' test.json | head -300
            exit 1
          }
