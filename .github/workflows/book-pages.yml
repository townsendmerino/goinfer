# The old address of the book, kept alive as a redirect. The book itself is built and served by site.yml at
# https://goinfer.dev/book/ (owner decision 2026-09-29: one host; docs/tasks/task-site-2026-09.md S5).
#
# WHY THIS STILL EXISTS. townsendmerino.github.io/goinfer/ is baked into things that cannot be edited: every released
# binary's web UI links to it, and the published v0.19.0 and v0.20.0 release notes quote it. Switching Pages off would turn
# those into 404s for good. So Pages serves one small file (.github/pages-stub/index.html) for every path of the old
# address, as both index.html and 404.html; it sends a visitor to the same page under goinfer.dev/book/.
#
# It only changes when the stub does. Do not delete this workflow or disable Pages without replacing those links first.
name: book-pages

on:
  push:
    branches: [main]
    paths:
      - '.github/pages-stub/**'
      - '.github/workflows/book-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Stage the stub as the front page and as the 404
        run: |
          set -euo pipefail
          mkdir -p _site
          cp .github/pages-stub/index.html _site/index.html
          cp .github/pages-stub/index.html _site/404.html
          # Non-vacuity: both files must send a visitor to goinfer.dev/book/, or the old links would dead-end.
          for f in _site/index.html _site/404.html; do
            grep -q 'https://goinfer.dev/book/' "$f"
            grep -q 'location.replace' "$f"
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
